        .tool-stage { display: grid; min-height: calc(100dvh - 70px); place-items: start center; padding: 40px 16px; }
        .app-container { width: 100%; max-width: 440px; padding: clamp(20px, 6vw, 32px); }
        .app-header { margin-bottom: 24px; }
        .app-title { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.8px; color: var(--ls-text); margin: 0 0 8px; }

        .color-wheel-container { position: relative; width: min(280px, 100%); aspect-ratio: 1; margin: 0 auto 24px; }
        #colorWheel { width: 100%; height: 100%; border-radius: 50%; cursor: crosshair; }
        .color-picker-cursor { position: absolute; width: 24px; height: 24px; border: 3px solid #fff; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); }
        .brightness-slider { margin: 24px 0; }
        .slider-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: var(--ls-muted); }
        .slider-value { padding: 2px 10px; border-radius: var(--ls-radius-pill); font-size: 12px; font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; height: 8px; border-radius: var(--ls-radius-pill); background: linear-gradient(to right, #000, #fff); box-shadow: var(--ls-ring); -webkit-appearance: none; appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ls-text); border: 2px solid #fff; cursor: pointer; }
        body.ls.page-color-picker .selected-color { margin-bottom: 24px; padding: 0; background: none; box-shadow: none; }
        .color-preview { width: 100%; height: 96px; border-radius: var(--ls-radius-sm); margin-bottom: 16px; box-shadow: var(--ls-ring); }
        .color-values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .value-label { font-size: 12px; margin-bottom: 6px; }
        .value-input { width: 100%; padding: 8px; border: 1px solid var(--ls-border); border-radius: var(--ls-radius-sm); font: 500 13px var(--ls-font-mono); text-align: center; cursor: pointer; }
        .value-input:focus-visible { border-color: var(--ls-text); }
        .history-title { font-size: 14px; margin-bottom: 10px; }
        .history-colors { display: flex; gap: 8px; flex-wrap: wrap; min-height: 36px; }
        .history-color { width: 36px; height: 36px; border-radius: var(--ls-radius-sm); cursor: pointer; box-shadow: var(--ls-ring); }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
        .btn { height: 40px; padding: 0 12px; border: 0; border-radius: var(--ls-radius-sm); font: 500 14px var(--ls-font); cursor: pointer; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; font-size: 14px; opacity: 0; transition: opacity 0.2s ease; z-index: 1000; pointer-events: none; }
        .toast.show { opacity: 1; }

    <script>
        // i18n translations
        const translations = {
            ko: {
                colorpicker: {
                    back: "홈으로 돌아가기",
                    title: "Color Picker",
                    subtitle: "원 안을 눌러 색을 고르세요. 값 칸을 누르면 복사됩니다.",
                    brightness: "밝기",
                    recent: "최근 색상",
                    copy: "HEX 복사",
                    random: "무작위 색",
                    colorCopied: "HEX 값을 복사했습니다.",
                    valueCopied: "값을 복사했습니다."
                }
            },
            en: {
                colorpicker: {
                    back: "Back to Home",
                    title: "Color Picker",
                    subtitle: "Click inside the wheel to pick a color. Click a value to copy it.",
                    brightness: "Brightness",
                    recent: "Recent Colors",
                    copy: "Copy HEX",
                    random: "Random color",
                    colorCopied: "HEX value copied.",
                    valueCopied: "value copied."
                }
            },
            ja: {
                colorpicker: {
                    back: "ホームに戻る",
                    title: "カラーピッカー",
                    subtitle: "円の中をクリックして色を選びます。値をクリックするとコピーできます。",
                    brightness: "明度",
                    recent: "最近の色",
                    copy: "HEXコピー",
                    random: "ランダムな色",
                    colorCopied: "HEX値をコピーしました。",
                    valueCopied: "の値をコピーしました。"
                }
            }
        };

        let currentLang = localStorage.getItem('language') || 'ko';

        function setLanguage(lang) {
            currentLang = translations[lang] ? lang : 'ko';
            localStorage.setItem('language', currentLang);
            document.documentElement.lang = currentLang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const keys = key.split('.');
                let translation = translations[currentLang];

                for (const k of keys) {
                    translation = translation?.[k];
                }

                if (translation) {
                    element.textContent = translation;
                }
            });

            document.querySelectorAll('.lang-btn').forEach(button => {
                button.classList.toggle('active', button.dataset.lang === currentLang);
            });
        }

        // Initialize language on load
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
            document.querySelectorAll('.lang-btn').forEach(button => {
                button.addEventListener('click', () => setLanguage(button.dataset.lang));
            });
        });
    </script>
    <script>
        let currentColor = { h: 0, s: 100, l: 50 };
        let brightness = 100;
        let colorHistory = [];
        const maxHistory = 8;

        const canvas = document.getElementById('colorWheel');
        const ctx = canvas.getContext('2d');
        const cursor = document.querySelector('.color-picker-cursor');
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const rgbValue = document.getElementById('rgbValue');
        const hslValue = document.getElementById('hslValue');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessValue = document.querySelector('.slider-value');

        function initColorWheel() {
            const size = Math.min(280, Math.floor(document.querySelector('.color-wheel-container').clientWidth));
            canvas.width = size;
            canvas.height = size;
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2;

            for (let angle = 0; angle < 360; angle += 1) {
                for (let r = 0; r < radius; r += 1) {
                    const saturation = (r / radius) * 100;
                    const x = centerX + r * Math.cos((angle * Math.PI) / 180);
                    const y = centerY + r * Math.sin((angle * Math.PI) / 180);

                    ctx.fillStyle = `hsl(${angle}, ${saturation}%, 50%)`;
                    ctx.fillRect(x, y, 2, 2);
                }
            }

            const initialX = centerX + (radius * 0.8) * Math.cos(0);
            const initialY = centerY + (radius * 0.8) * Math.sin(0);
            cursor.style.left = initialX + 'px';
            cursor.style.top = initialY + 'px';
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color);
            };
            return { r: f(0), g: f(8), b: f(4) };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function updateColor() {
            const adjustedL = currentColor.l * (brightness / 100);
            const rgb = hslToRgb(currentColor.h, currentColor.s, adjustedL);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);

            colorPreview.style.background = hex;
            cursor.style.backgroundColor = hex;
            hexValue.value = hex.toUpperCase();
            rgbValue.value = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
            hslValue.value = `${Math.round(currentColor.h)}°, ${Math.round(currentColor.s)}%, ${Math.round(adjustedL)}%`;

        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const dx = x - centerX;
            const dy = y - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = canvas.width / 2;

            if (distance <= maxDistance) {
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                if (angle < 0) angle += 360;

                currentColor.h = angle;
                currentColor.s = Math.min(100, (distance / maxDistance) * 100);

                cursor.style.left = x + 'px';
                cursor.style.top = y + 'px';

                updateColor();
                addToHistory();
            }
        });

        brightnessSlider.addEventListener('input', (e) => {
            brightness = e.target.value;
            brightnessValue.textContent = brightness + '%';
            updateColor();
        });

        function addToHistory() {
            const rgb = hslToRgb(currentColor.h, currentColor.s, currentColor.l * (brightness / 100));
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);

            if (!colorHistory.includes(hex)) {
                colorHistory.unshift(hex);
                if (colorHistory.length > maxHistory) {
                    colorHistory.pop();
                }
                renderHistory();
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyColors');
            container.innerHTML = '';
            colorHistory.forEach(color => {
                const div = document.createElement('div');
                div.className = 'history-color';
                div.style.backgroundColor = color;
                div.title = color;
                div.onclick = () => applyHistoryColor(color);
                container.appendChild(div);
            });
        }

        function applyHistoryColor(hex) {
            const rgb = hexToRgb(hex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            currentColor = hsl;
            brightness = 100;
            brightnessSlider.value = 100;
            brightnessValue.textContent = '100%';
            updateColor();

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = (canvas.width / 2) * (hsl.s / 100);
            const angle = hsl.h * (Math.PI / 180);
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }

            return {
                h: h * 360,
                s: s * 100,
                l: l * 100
            };
        }

        function copyToClipboard() {
            const hex = hexValue.value;
            navigator.clipboard.writeText(hex).then(() => {
                const message = translations[currentLang].colorpicker.colorCopied;
                showToast(message);
            });
        }

        function randomColor() {
            currentColor.h = Math.random() * 360;
            currentColor.s = 50 + Math.random() * 50;
            currentColor.l = 40 + Math.random() * 20;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = (canvas.width / 2) * (currentColor.s / 100);
            const angle = currentColor.h * (Math.PI / 180);
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);

            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';

            updateColor();
            addToHistory();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.querySelectorAll('.value-input').forEach(input => {
            input.addEventListener('click', function () {
                navigator.clipboard.writeText(this.value).then(() => {
                    const valueType = this.previousElementSibling.textContent;
                    const message = `${valueType} ${translations[currentLang].colorpicker.valueCopied}`;
                    showToast(message);
                });
            });
        });

        initColorWheel();
        updateColor();
        addToHistory();
    </script>
