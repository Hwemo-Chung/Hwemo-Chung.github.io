<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린샷 꾸미기 | 창 테두리·배경·그림자 넣어 PNG로 저장</title>
<meta name="description" content="스크린샷에 macOS 창이나 브라우저 주소창 테두리, 배경색, 여백, 둥근 모서리, 그림자를 넣고 16:9, 1:1, 4:5 비율의 2배 해상도 PNG로 받습니다.">
<link rel="canonical" href="https://hwemo-chung.github.io/tools/shot-frame/">
<link rel="stylesheet" href="../common/tool.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3498371918924514" crossorigin="anonymous"></script>
<style>
  [hidden] { display: none !important; }
  .view { padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 420px; }
  .view canvas { display: block; max-width: 100%; max-height: 560px; box-shadow: var(--ring); }
  .swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .swatches button { width: 28px; height: 28px; border-radius: 6px; border: 0; box-shadow: var(--ring); cursor: pointer; padding: 0; }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--ink); }
  .swatches input[type="color"] { width: 28px; height: 28px; }
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lumos">
<meta property="og:title" content="스크린샷 꾸미기 | 창 테두리·배경·그림자 넣어 PNG로 저장">
<meta property="og:description" content="스크린샷에 macOS 창이나 브라우저 주소창 테두리, 배경색, 여백, 둥근 모서리, 그림자를 넣고 16:9, 1:1, 4:5 비율의 2배 해상도 PNG로 받습니다.">
<meta property="og:url" content="https://hwemo-chung.github.io/tools/shot-frame/">
<meta property="og:image" content="https://hwemo-chung.github.io/assets/og-tools.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="bar">
  <a class="home" href="/">Lumos</a><span class="sep">/</span><a class="here" href="/tools/">도구</a>
</header>

<main class="page">
  <div class="head">
    <h1>스크린샷 꾸미기</h1>
    <p>스크린샷을 놓고 창 모양과 배경을 고르세요.</p>
  </div>

  <div class="work">
    <aside>
      <section class="panel">
        <div class="field">
          <span>창 모양</span>
          <div class="seg" id="chrome">
            <button type="button" data-v="mac" aria-pressed="true">macOS</button>
            <button type="button" data-v="browser" aria-pressed="false">브라우저</button>
            <button type="button" data-v="none" aria-pressed="false">없음</button>
          </div>
        </div>
        <label class="field" id="titleField">
          <span>제목</span>
          <input type="text" id="title" placeholder="창 제목이나 주소" maxlength="80">
        </label>
        <div class="field">
          <span>배경</span>
          <div class="swatches" id="bg">
            <button type="button" data-v="#f5f5f5" aria-pressed="true" aria-label="아주 밝은 회색"></button>
            <button type="button" data-v="#ebebeb" aria-pressed="false" aria-label="밝은 회색"></button>
            <button type="button" data-v="#a1a1a1" aria-pressed="false" aria-label="회색"></button>
            <button type="button" data-v="#4d4d4d" aria-pressed="false" aria-label="어두운 회색"></button>
            <button type="button" data-v="#171717" aria-pressed="false" aria-label="검정"></button>
            <input type="color" id="color" value="#dfe6ee" aria-label="직접 고르기">
          </div>
        </div>
        <div class="field">
          <span>비율</span>
          <div class="seg" id="ratio">
            <button type="button" data-v="0" aria-pressed="true">자유</button>
            <button type="button" data-v="1.7778" aria-pressed="false">16:9</button>
            <button type="button" data-v="1" aria-pressed="false">1:1</button>
            <button type="button" data-v="0.8" aria-pressed="false">4:5</button>
          </div>
        </div>
        <label class="field">
          <span>여백 <output id="padOut">64px</output></span>
          <input type="range" id="pad" min="0" max="200" value="64">
        </label>
        <label class="field">
          <span>모서리 <output id="radOut">10px</output></span>
          <input type="range" id="rad" min="0" max="32" value="10">
        </label>
        <label class="field">
          <span>그림자 <output id="shOut">50</output></span>
          <input type="range" id="shadow" min="0" max="100" value="50">
        </label>
      </section>
      <section class="panel">
        <div class="row">
          <button class="btn primary" id="save" disabled>PNG로 받기</button>
          <button class="btn" id="other" disabled>다른 스크린샷</button>
        </div>
        <p class="status" id="status"></p>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>스크린샷을 여기에 놓거나 눌러서 고르세요</strong>
        <small>PNG, JPG, WebP · 복사한 화면은 Ctrl+V(⌘V)로 붙여넣기</small>
      </div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="view" id="view" hidden><canvas id="preview"></canvas></div>
    </section>
  </div>
</main>

<footer class="foot">
  <span>이미지는 이 브라우저에서 처리하며 어디에도 올라가지 않습니다.</span>
  <a href="/tools/">다른 도구</a>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
