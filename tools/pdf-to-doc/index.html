<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Word 변환 | PDF를 DOCX 문서로 바꾸기 (제목·표·그림 유지, 스캔 OCR)</title>
<meta name="description" content="PDF를 Word 문서(DOCX)로 바꿉니다. 제목, 문단, 굵은 글씨, 목록, 간단한 표, 그림을 살리고 스캔한 쪽은 글자 인식으로 읽습니다.">
<link rel="canonical" href="https://hwemo-chung.github.io/tools/pdf-to-doc/">
<link rel="stylesheet" href="../common/tool.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3498371918924514" crossorigin="anonymous"></script>
<style>
  #preview { padding: 32px 40px; max-height: 760px; overflow: auto; color: var(--ink); font-size: 14px; line-height: 1.7; }
  #preview h1, #preview h2, #preview h3 { font-weight: 600; letter-spacing: -0.3px; margin: 20px 0 8px; }
  #preview h1 { font-size: 22px; line-height: 30px; }
  #preview h2 { font-size: 18px; line-height: 26px; }
  #preview h3 { font-size: 15px; line-height: 22px; }
  #preview p { margin: 0 0 10px; }
  #preview ul { margin: 0 0 4px; padding-left: 20px; }
  #preview p.num { padding-left: 20px; text-indent: -20px; }
  #preview img { display: block; margin: 12px 0; border-radius: 4px; box-shadow: var(--ring); }
  #preview table.data { margin: 8px 0 16px; }
  #preview table.data td { border: 1px solid var(--line); }
  #preview .page { margin: 24px 0 8px; font: 12px/16px var(--mono); color: var(--mute); }
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lumos">
<meta property="og:title" content="PDF Word 변환 | PDF를 DOCX 문서로 바꾸기 (제목·표·그림 유지, 스캔 OCR)">
<meta property="og:description" content="PDF를 Word 문서(DOCX)로 바꿉니다. 제목, 문단, 굵은 글씨, 목록, 간단한 표, 그림을 살리고 스캔한 쪽은 글자 인식으로 읽습니다.">
<meta property="og:url" content="https://hwemo-chung.github.io/tools/pdf-to-doc/">
<meta property="og:image" content="https://hwemo-chung.github.io/assets/og-tools.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="bar">
  <a class="home" href="/">Lumos</a><span class="sep">/</span><a class="here" href="/tools/">도구</a>
</header>

<main class="page">
  <div class="head">
    <h1>PDF를 Word 문서로 바꾸기</h1>
    <p>PDF를 놓고 오른쪽 미리보기를 확인한 뒤 DOCX로 받으세요.</p>
  </div>

  <div class="work">
    <aside>
      <section class="panel" id="pwPanel" hidden>
        <form id="pwForm">
          <label class="field">
            <span>PDF 비밀번호</span>
            <input type="password" id="pw" autocomplete="off">
          </label>
          <p class="hint" id="pwHint">이 PDF는 비밀번호가 있어야 열립니다.</p>
          <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">열기</button></div>
        </form>
      </section>
      <section class="panel">
        <div class="field">
          <span>스캔한 쪽</span>
          <div class="seg" id="scan">
            <button type="button" data-v="ocr" aria-pressed="true">글자로 읽기</button>
            <button type="button" data-v="image" aria-pressed="false">그림으로 넣기</button>
          </div>
        </div>
        <p class="hint">글자 인식은 한국어와 영어를 읽으며, 처음 한 번 약 6MB를 받습니다.</p>
      </section>
      <section class="panel">
        <div class="row">
          <button class="btn primary" id="save" disabled>DOCX로 받기</button>
          <button class="btn" id="clear" disabled>비우기</button>
        </div>
        <div class="progress" id="prog" hidden><i></i></div>
        <p class="status" id="status"></p>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>PDF를 여기에 놓거나 눌러서 고르세요</strong>
        <small>PDF 한 개 · 최대 200쪽</small>
      </div>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <article id="preview" hidden></article>
    </section>
  </div>
</main>

<footer class="foot">
  <span>파일은 이 브라우저에서 처리하며 어디에도 올라가지 않습니다.</span>
  <a href="/tools/">다른 도구</a>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
