<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보컬 분리 | 노래에서 목소리와 반주(MR) 나누기, WAV 받기</title>
<meta name="description" content="노래 파일을 올리면 HTDemucs 모델로 보컬과 반주를 나눠 각각 WAV로 받습니다. 3~4분짜리 곡 전체를 처리합니다.">
<link rel="canonical" href="https://hwemo-chung.github.io/tools/vocal-split/">
<link rel="stylesheet" href="../common/tool.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3498371918924514" crossorigin="anonymous"></script>
<style>
  .result { padding: 20px; display: grid; gap: 20px; }
  .track { display: grid; gap: 8px; }
  .track .row { justify-content: space-between; }
  .track strong { font-weight: 500; }
  .track audio { width: 100%; }
  .track canvas { width: 100%; height: 64px; display: block; background: var(--soft); border-radius: 6px; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
  dl.facts dt { color: var(--mute); }
  dl.facts dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--body); }
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lumos">
<meta property="og:title" content="보컬 분리 | 노래에서 목소리와 반주(MR) 나누기, WAV 받기">
<meta property="og:description" content="노래 파일을 올리면 HTDemucs 모델로 보컬과 반주를 나눠 각각 WAV로 받습니다. 3~4분짜리 곡 전체를 처리합니다.">
<meta property="og:url" content="https://hwemo-chung.github.io/tools/vocal-split/">
<meta property="og:image" content="https://hwemo-chung.github.io/assets/og-tools.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="bar">
  <a class="home" href="/">Lumos</a><span class="sep">/</span><a class="here" href="/tools/">도구</a>
</header>

<main class="page">
  <div class="head">
    <h1>보컬 분리</h1>
    <p>노래 파일을 올리고 나누기를 누르세요. 보컬과 반주를 각각 WAV로 받습니다.</p>
  </div>

  <div class="work">
    <aside>
      <section class="panel">
        <dl class="facts" id="facts">
          <dt>파일</dt><dd id="fName">없음</dd>
          <dt>길이</dt><dd id="fDur">-</dd>
          <dt>예상</dt><dd id="fEta">-</dd>
        </dl>
      </section>
      <section class="panel">
        <button class="btn primary block" id="run" disabled>나누기</button>
        <div class="progress" id="bar" hidden><i></i></div>
        <p class="status" id="status"></p>
        <p class="hint">처음 한 번 모델 172 MB를 받습니다. 그래픽 가속(WebGPU)이 되는 Chrome·Edge에서 가장 빠릅니다.</p>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>노래 파일을 여기에 놓거나 눌러서 고르세요</strong>
        <small>MP3, WAV, M4A, OGG, FLAC · 한 곡</small>
      </div>
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac" hidden>
      <div class="result" id="result" hidden>
        <div class="track">
          <div class="row"><strong>원곡</strong><button class="btn" id="pick">다른 곡</button></div>
          <canvas id="wMix" width="1200" height="64"></canvas>
          <audio id="aMix" controls></audio>
        </div>
        <div class="track" id="tVoc" hidden>
          <div class="row"><strong>보컬</strong><button class="btn" id="dVoc">보컬 WAV 받기</button></div>
          <canvas id="wVoc" width="1200" height="64"></canvas>
          <audio id="aVoc" controls></audio>
        </div>
        <div class="track" id="tInst" hidden>
          <div class="row"><strong>반주</strong><button class="btn" id="dInst">반주 WAV 받기</button></div>
          <canvas id="wInst" width="1200" height="64"></canvas>
          <audio id="aInst" controls></audio>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <span>노래 파일은 이 브라우저에서 처리하며 어디에도 올라가지 않습니다. 모델: HTDemucs (Meta, MIT).</span>
  <a href="/tools/">다른 도구</a>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
