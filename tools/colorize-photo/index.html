<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흑백 사진 컬러로 바꾸기 | 옛날 사진 색 복원 (DDColor)</title>
<meta name="description" content="흑백 사진이나 빛바랜 옛날 사진을 올리면 DDColor 모델이 색을 입혀 컬러 사진으로 바꿉니다. 원본과 나란히 비교하고 색 진하기를 조절해 받습니다.">
<link rel="canonical" href="https://hwemo-chung.github.io/tools/colorize-photo/">
<link rel="stylesheet" href="../common/tool.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3498371918924514" crossorigin="anonymous"></script>
<style>
  .view { padding: 12px; }
  .view[hidden] { display: none; }
  .pane { position: relative; margin: 0 auto; line-height: 0; }
  .pane canvas, .pane img { display: block; max-width: none; width: 100%; height: 100%; }
  .pane .over { position: absolute; inset: 0; }
  .pane .line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); pointer-events: none; }
  .viewbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-top: 12px; }
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lumos">
<meta property="og:title" content="흑백 사진 컬러로 바꾸기 | 옛날 사진 색 복원 (DDColor)">
<meta property="og:description" content="흑백 사진이나 빛바랜 옛날 사진을 올리면 DDColor 모델이 색을 입혀 컬러 사진으로 바꿉니다. 원본과 나란히 비교하고 색 진하기를 조절해 받습니다.">
<meta property="og:url" content="https://hwemo-chung.github.io/tools/colorize-photo/">
<meta property="og:image" content="https://hwemo-chung.github.io/assets/og-tools.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="bar">
  <a class="home" href="/">Lumos</a><span class="sep">/</span><a class="here" href="/tools/">도구</a>
</header>

<main class="page">
  <div class="head">
    <h1>흑백 사진 컬러로 바꾸기</h1>
    <p>흑백 사진을 올리고 색 입히기를 누르세요.</p>
  </div>

  <div class="work">
    <aside>
      <section class="panel">
        <label class="field">
          <span>색 진하기 <output id="amountOut">100%</output></span>
          <input type="range" id="amount" min="0" max="150" value="100" disabled>
        </label>
        <p class="hint">색이 너무 진하거나 옅으면 여기서 맞추세요.</p>
      </section>
      <section class="panel">
        <div class="row">
          <button class="btn primary" id="run" disabled>색 입히기</button>
          <button class="btn" id="save" disabled>받기</button>
        </div>
        <div class="progress" id="bar" hidden><i></i></div>
        <p class="status" id="status"></p>
        <p class="hint">처음 한 번은 모델(약 130MB)을 받습니다.</p>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>흑백 사진을 여기에 놓거나 눌러서 고르세요</strong>
        <small>JPG, PNG, WebP · 붙여넣기도 됩니다</small>
        <!-- Dorothea Lange, "Migrant Mother", 1936, FSA/OWI, Library of Congress (public domain): https://commons.wikimedia.org/wiki/File:Lange-MigrantMother02.jpg (960px thumbnail) -->
        <button class="btn" type="button" id="sample">예시 사진으로 해 보기</button>
      </div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="view" id="view" hidden>
        <div class="pane" id="pane">
          <img id="before" alt="원본">
          <canvas class="over" id="after"></canvas>
          <div class="line" id="line" hidden></div>
        </div>
        <div class="viewbar">
          <span class="meta">원본</span>
          <input type="range" id="cmp" min="0" max="100" value="50" aria-label="원본과 결과 경계" disabled>
          <span class="meta">컬러</span>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <span>사진은 이 브라우저에서 처리하며 어디에도 올라가지 않습니다.</span>
  <a href="/tools/">다른 도구</a>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
