        (function () {
            if (/^\/hot-?launcher\/?$/i.test(location.pathname)) location.replace("/hot-launcher.html");
            if (location.pathname === "/lumos-fireworks" || location.pathname.indexOf("/lumos-fireworks/") === 0) {
                try {
                    sessionStorage.setItem(
                        "lumos-fireworks-path",
                        location.pathname + location.search + location.hash
                    );
                } catch (e) {}
                location.replace("/lumos-fireworks/");
            }
        })();
    </script>
