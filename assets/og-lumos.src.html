<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:#ffffff;
    color:oklch(0.145 0 0);
    font-family:-apple-system,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;
    padding:76px 80px 68px;position:relative;overflow:hidden;
  }
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:40px}
  .brand span{font-size:24px;letter-spacing:.32em;font-weight:700}
  .flame{width:15px;height:15px;border-radius:50%;background:#f59e0b;
    box-shadow:0 0 0 7px rgba(245,158,11,.16), 0 0 26px 6px rgba(245,158,11,.34)}
  h1{font-size:64px;line-height:1.2;font-weight:800;letter-spacing:-.025em;word-break:keep-all;max-width:1000px}
  .sub{margin-top:28px;font-size:26px;line-height:1.55;color:oklch(0.556 0 0);max-width:940px;word-break:keep-all}
  .foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:21px}
  .pill{border:1px solid oklch(0.922 0 0);border-radius:999px;padding:10px 22px;
    color:oklch(0.205 0 0);font-size:20px;background:oklch(0.97 0 0)}
  .url{margin-left:auto;color:oklch(0.556 0 0);font-size:21px}
  .rule{position:absolute;left:0;top:0;height:7px;width:100%;
    background:linear-gradient(90deg,#f59e0b 0%,#f59e0b 26%,oklch(0.922 0 0) 26%,oklch(0.922 0 0) 100%)}
</style></head><body>
  <div class="rule"></div>
  <div class="brand"><i class="flame"></i><span>LUMOS</span></div>
  <h1>방치된 하이브리드 앱,<br>스토어 봉쇄부터 풉니다.</h1>
  <p class="sub">iOS 26 SDK 의무화 · Play 타겟 API · Dynamic Links 종료 —<br>Cordova · Ionic · Capacitor 프로덕션 진단과 유지보수.</p>
  <div class="foot">
    <span class="pill">진단 10곳 한정 무료</span>
    <span class="pill">영업일 2일 회신</span>
    <span class="url">hwemo-chung.github.io</span>
  </div>
</body></html>
