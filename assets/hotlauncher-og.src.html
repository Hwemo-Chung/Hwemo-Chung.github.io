<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  hotlauncher-og.png 원본 템플릿 (1200x630).
  재생성:
  google-chrome --headless=new --no-sandbox --screenshot=assets/hotlauncher-og.png \
    --window-size=1200,630 --hide-scrollbars file:///.../assets/hotlauncher-og.src.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", "DejaVu Sans", sans-serif;
    background: #ffffff;
    color: #171717;
    display: flex;
    align-items: stretch;
  }
  .left {
    width: 800px;
    padding: 76px 0 64px 80px;
    display: flex;
    flex-direction: column;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    border: 1px solid #e5e5e5;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 700;
    color: #404040;
    background: #fafafa;
  }
  .badge .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #3f9142;
  }
  .name {
    margin-top: 44px;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1.05;
  }
  .sub {
    margin-top: 28px;
    font-size: 42px;
    font-weight: 700;
    line-height: 1.4;
    color: #404040;
    word-break: keep-all;
  }
  .meta {
    margin-top: auto;
    font-size: 26px;
    color: #737373;
  }
  .domain {
    margin-top: 10px;
    font-size: 23px;
    color: #a3a3a3;
  }
  .grid {
    width: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cells {
    display: grid;
    grid-template-columns: repeat(2, 92px);
    grid-template-rows: repeat(5, 92px);
    gap: 16px;
  }
  .cell {
    border-radius: 22px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
  }
  .cell--key {
    background: #171717;
    border-color: #171717;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    font-weight: 700;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
  }
</style>
</head>
<body>
  <div class="left">
    <div class="badge"><span class="dot"></span>macOS 26 &middot; Launchpad removed</div>
    <div class="name">HotLauncher</div>
    <div class="sub">사라진 런치패드 대신,<br />단축키 한 번으로 앱을 엽니다</div>
    <div class="meta">Up to 20 global hotkeys &middot; Free &middot; No ads &middot; Build from source</div>
    <div class="domain">hwemo-chung.github.io</div>
  </div>
  <div class="grid">
    <div class="cells">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell--key cell">&#8984;</div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </div>
</body>
</html>
